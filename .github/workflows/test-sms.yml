name: Test SMS MCP server

on:
  pull_request:
    paths:
      - "server/mcp_server_sms/**"
      - ".github/workflows/test-sms.yml"
  push:
    branches: [main]
    paths:
      - "server/mcp_server_sms/**"
      - ".github/workflows/test-sms.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e './server/mcp_server_sms[test]'
      - name: Check and test
        working-directory: server/mcp_server_sms
        run: |
          ruff check src tests
          pytest -q
          python -m build
          python -m twine check dist/*
