[project]
name = "mcp-server-sms"
version = "0.1.0"
description = "Volcengine domestic SMS qualification, application and delivery tools for MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pydantic>=2.11,<3",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=45",
    "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
mcp-server-sms = "mcp_server_sms.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "build>=1", "twine>=6", "ruff>=0.16,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_sms"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
