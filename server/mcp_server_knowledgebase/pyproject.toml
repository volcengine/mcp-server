[project]
name = "mcp-server-knowledgebase"
version = "0.2.2"
description = "MCP server for Viking Knowledge Base Service"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp[cli]>=2.1.1,<3",
    "volcengine>=1.0.171",
    "aiohttp>=3.11.14",
]

[project.scripts]
mcp-server-knowledgebase = "mcp_server_knowledgebase.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
